<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <rect width="1100" height="650" rx="24" fill="#f3f6fa"/>
  <text x="550" y="52" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#18324d">HX4S20 · OLED 与矩阵键盘接线</text>
  <rect x="55" y="95" width="400" height="500" rx="18" fill="#18324d"/>
  <text x="255" y="138" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="white">开发板 J1</text>
  <text x="85" y="184" font-family="sans-serif" font-size="18" fill="#bcd0e4">物理脚  FPGA 封装脚  信号</text>
  <g font-family="sans-serif" font-size="20" fill="white">
    <text x="90" y="226">1</text><text x="190" y="226">D14</text><text x="315" y="226">OLED SDA</text>
    <text x="90" y="264">2</text><text x="190" y="264">G11</text><text x="315" y="264">OLED SCL</text>
    <text x="90" y="302">3–6</text><text x="190" y="302">G12 / F13</text><text x="315" y="302">R1–R2</text>
    <text x="190" y="334">H13 / H14</text><text x="315" y="334">R3–R4</text>
    <text x="90" y="374">7–10</text><text x="190" y="374">J14 / J13</text><text x="315" y="374">C1–C2</text>
    <text x="190" y="406">K12 / L14</text><text x="315" y="406">C3–C4</text>
    <text x="90" y="446">12 或 30</text><text x="315" y="446">GND</text>
    <text x="90" y="484">29</text><text x="315" y="484">3.3 V</text>
    <text x="90" y="536" fill="#ffcf75">11 是 5 V，不接 OLED VCC</text>
  </g>
  <rect x="650" y="125" width="370" height="155" rx="18" fill="white" stroke="#98abc0" stroke-width="2"/>
  <text x="835" y="165" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324d">SSD1306 OLED</text>
  <text x="690" y="208" font-family="sans-serif" font-size="19" fill="#304b66">GND → J1-12/30　VCC → J1-29</text>
  <text x="690" y="245" font-family="sans-serif" font-size="19" fill="#304b66">SDA → J1-1　SCL → J1-2</text>
  <rect x="650" y="345" width="370" height="190" rx="18" fill="white" stroke="#98abc0" stroke-width="2"/>
  <text x="835" y="385" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324d">4×4 矩阵键盘</text>
  <text x="690" y="430" font-family="sans-serif" font-size="19" fill="#304b66">R1–R4 → J1-3 至 J1-6</text>
  <text x="690" y="468" font-family="sans-serif" font-size="19" fill="#304b66">C1–C4 → J1-7 至 J1-10</text>
  <text x="690" y="506" font-family="sans-serif" font-size="16" fill="#667d93">按信号名逐根连接，不按排线位置猜测</text>
  <text x="550" y="625" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#667d93">接线前以板卡 J1 的 1 脚标记为准；OLED 逻辑电平为 3.3 V</text>
</svg>
